{{- if .Values.generator.serviceAccount.create -}}
# Identity for generator runs, kept separate from the controller's own: the
# controller only reads the store, while the runs it starts write to it. Two
# accounts means two cloud roles, so a build cannot delete artifacts and the
# controller cannot push them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "artifact-controller.generatorServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "artifact-controller.labels" . | nindent 4 }}
  {{- with .Values.generator.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
