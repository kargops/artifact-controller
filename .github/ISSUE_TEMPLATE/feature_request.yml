name: Feature request
description: Propose new behavior, a new driver, or an API change
labels: ["type/feature"]
body:
  - type: markdown
    attributes:
      value: |
        This project is young (v1alpha1) and deliberately small. The best first
        contribution is often an issue describing what you tried and where it
        surprised you — that is a feature request in its most useful form.

        Requesting a new store driver? Think twice first: the `http` driver plus
        an ArtifactClass covers most stores without a controller release. A
        dedicated driver earns its place when the store needs bespoke signing or
        semantics CEL cannot express.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where the current behavior stops you. Concrete beats abstract — a real ArtifactClass you wish you could write says more than a paragraph.
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: Proposed shape (optional)
      description: If you have a spec/API shape in mind, sketch it. YAML welcome.
      render: yaml
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - api (CRDs, spec fields)
        - controller (reconcile behavior)
        - store (a driver)
        - generator (run templating/interpretation)
        - chart (Helm packaging)
        - docs
    validations:
      required: true
