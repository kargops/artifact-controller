name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@v5
      # CI_COMMIT_TAG arms the gate's release assertion: Chart.yaml's
      # version/appVersion must match the tag being released.
      - name: Run the gate
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
        run: ./ci/test.sh

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push image + chart to GHCR
      id-token: write # OIDC token for cosign keyless signing
    env:
      IMG: ghcr.io/${{ github.repository_owner }}/artifact-controller
      CHART_OCI: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@v5
      - uses: sigstore/cosign-installer@v4
      - uses: anchore/sbom-action/download-syft@v0
        id: syft
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log helm into GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Published chart versions are immutable. OCI pushes overwrite silently,
      # so this guard must FAIL CLOSED: only an explicit not-found may pass.
      # (helm pull exits 1 identically for "absent", "auth failed", and
      # "registry down" — the exit code alone cannot distinguish "verified
      # absent" from "could not verify".) A re-run after a partial release is
      # allowed only when the published content is byte-identical.
      - name: Refuse to republish an existing chart version
        id: guard
        run: |
          v="${GITHUB_REF_NAME#v}"
          if out=$(helm pull "$CHART_OCI/artifact-controller" --version "$v" -d /tmp 2>&1); then
            mkdir -p /tmp/pulled /tmp/local
            tar -xzf "/tmp/artifact-controller-$v.tgz" -C /tmp/pulled
            helm package charts/artifact-controller -d /tmp/local >/dev/null
            tar -xzf "/tmp/local/artifact-controller-$v.tgz" -C /tmp/local
            if diff -r /tmp/pulled/artifact-controller /tmp/local/artifact-controller >/dev/null; then
              echo "chart $v already published with identical content — skipping chart push (job re-run)"
              echo "push=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::chart version $v already exists in $CHART_OCI with different content — bump Chart.yaml"
            exit 1
          fi
          if ! echo "$out" | grep -qiE 'not found|manifest unknown|name unknown'; then
            echo "$out"
            echo "::error::could not verify that chart version $v is unpublished — refusing to push"
            exit 1
          fi
          echo "chart version $v is unpublished — ok"
          echo "push=true" >> "$GITHUB_OUTPUT"

      # The Dockerfile cross-compiles via TARGETARCH from the build platform,
      # so no QEMU is needed for the multi-arch build.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMG }}:${{ github.ref_name }}
            ${{ env.IMG }}:latest

      # Keyless: the signature binds this exact digest to this workflow's OIDC
      # identity (repo, workflow path, tag). Signing the digest, never the tag
      # — tags are mutable, digests are the artifact.
      - name: Sign the image and attest its SBOMs
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          # The exact Fulcio identity this run signs with; anything looser
          # would also match signatures minted by other workflows in the repo.
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign sign --yes "$IMG@$DIGEST"
          mkdir -p dist
          # syft inventories ONE platform per scan (amd64 by default), so a
          # single SBOM on a multi-arch index would misdescribe arm64. One
          # SBOM per platform, attested to that platform's manifest digest;
          # the amd64 one is also attested to the index so verifying by tag
          # resolves something.
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#linux/}"
            arch_digest=$(docker buildx imagetools inspect "$IMG@$DIGEST" --format '{{json .Manifest}}' \
              | jq -r --arg p "$platform" \
                '.manifests[] | select(.platform != null and (.platform.os + "/" + .platform.architecture) == $p) | .digest')
            test -n "$arch_digest"
            "${{ steps.syft.outputs.cmd }}" --platform "$platform" "$IMG@$DIGEST" -o spdx-json > "dist/sbom.$arch.spdx.json"
            cosign attest --yes --type spdxjson --predicate "dist/sbom.$arch.spdx.json" "$IMG@$arch_digest"
          done
          cosign attest --yes --type spdxjson --predicate dist/sbom.amd64.spdx.json "$IMG@$DIGEST"
          cosign verify "$IMG@$DIGEST" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          echo "image signed, per-arch SBOMs attested, signature verified"

      - name: Package and push the chart
        if: steps.guard.outputs.push == 'true'
        run: |
          mkdir -p dist
          helm package charts/artifact-controller -d dist/
          helm push "dist/artifact-controller-${GITHUB_REF_NAME#v}.tgz" "$CHART_OCI"

      # Unconditional (not gated on the push step) so a job re-run signs a
      # chart that was pushed by a previous partial attempt. Artifact Hub's
      # tracker checks for a cosign signature on the chart reference to grant
      # the signed badge.
      - name: Sign the chart
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          out=$(helm pull "$CHART_OCI/artifact-controller" --version "$v" -d /tmp 2>&1)
          digest=$(echo "$out" | awk '/Digest:/{print $2}')
          test -n "$digest"
          # Legacy signature format on purpose: Artifact Hub's tracker (and
          # most Helm-ecosystem verifiers) look for the classic .sig tag, not
          # cosign v3's OCI 1.1 referrer bundles.
          cosign sign --yes --new-bundle-format=false \
            "ghcr.io/${{ github.repository_owner }}/charts/artifact-controller@$digest"
          cosign verify "ghcr.io/${{ github.repository_owner }}/charts/artifact-controller@$digest" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          echo "chart signed and verified"

      - name: Render the install bundle pinned to this release
        run: |
          make release-manifest IMG="$IMG" VERSION="$GITHUB_REF_NAME"
          make crds-manifest
          grep -q "image: $IMG:$GITHUB_REF_NAME" dist/install.yaml
          grep -q "kind: CustomResourceDefinition" dist/crds.yaml
          echo "install bundle pinned to $IMG:$GITHUB_REF_NAME"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notes.md <<NOTES
          ## Install

          Helm:

              helm install artifact-controller $CHART_OCI/artifact-controller \\
                --version ${GITHUB_REF_NAME#v} -n artifact-system --create-namespace

          Flat bundle (CRDs + RBAC + Deployment, pinned to $IMG:$GITHUB_REF_NAME):

              kubectl apply --server-side -f \\
                https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/install.yaml

          CRDs alone (pairs with the chart's crds.install=false):

              kubectl apply --server-side -f \\
                https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/crds.yaml

          Then see the quickstart: docs/quickstart.md

          ## Verify

          Image and chart are signed keyless (Sigstore). The image signature
          uses cosign v3's bundle format (OCI 1.1 referrers) — verifying it
          requires cosign v3+. Per-architecture SPDX SBOMs are attested to
          the image and attached below.

              cosign verify ghcr.io/${{ github.repository }}:$GITHUB_REF_NAME \\
                --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@$GITHUB_REF" \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/install.yaml dist/crds.yaml dist/sbom.amd64.spdx.json dist/sbom.arm64.spdx.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/install.yaml dist/sbom.spdx.json \
              --title "artifact-controller $GITHUB_REF_NAME" \
              --notes-file /tmp/notes.md
          fi
