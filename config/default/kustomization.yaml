apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The full install: CRDs, RBAC, and the controller Deployment.
namespace: artifact-system

resources:
- ../crd
- ../rbac
- ../manager

labels:
- pairs:
    app.kubernetes.io/name: artifact-controller
    app.kubernetes.io/part-of: artifact-controller

images:
- name: ghcr.io/kargops/artifact-controller
  newName: ghcr.io/kargops/artifact-controller
  newTag: v0.0.0-dev
