apiVersion: v1
kind: Namespace
metadata:
  name: artifact-system
  labels:
    app.kubernetes.io/name: artifact-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-controller
  namespace: artifact-system
  labels:
    app.kubernetes.io/name: artifact-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: artifact-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: artifact-controller
    spec:
      serviceAccountName: artifact-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: manager
          image: ghcr.io/kargops/artifact-controller:latest # replaced by kustomize
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --concurrent=4
          ports:
            - name: metrics
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
