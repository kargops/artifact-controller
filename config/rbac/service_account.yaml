# The identity the controller runs as, and the attachment point for cloud
# credentials. Its name and namespace are part of the install contract — an
# EKS Pod Identity association or IRSA trust policy references them by name,
# so renaming here means re-pointing that association.
#
# EKS Pod Identity (preferred): no annotation goes here. Associate the role on
# the AWS side, which requires the eks-pod-identity-agent addon on the cluster:
#
#   aws eks create-pod-identity-association \
#     --cluster-name <cluster> \
#     --namespace artifact-system \
#     --service-account artifact-controller \
#     --role-arn arn:aws:iam::<account>:role/artifact-controller
#
# IRSA (alternative): uncomment the annotation below instead, and trust the
# cluster OIDC provider for system:serviceaccount:artifact-system:artifact-controller.
#
# Either way the credentials reach the process through the default AWS chain,
# so both the s3 store driver and the ECR keychain pick them up with no
# configuration.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: artifact-controller
  namespace: artifact-system
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/artifact-controller
