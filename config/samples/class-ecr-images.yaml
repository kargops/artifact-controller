# Container images in ECR, generated by a Tekton pipeline. Note the key
# template: OCI tags may not contain ':', so oci classes address by bare hex
# ({{ .SpecHex }}) rather than the "sha256:..." form used for object stores.
# This is also the default when keyTemplate is omitted for driver: oci.
apiVersion: artifacts.kargops.dev/v1alpha1
kind: ArtifactClass
metadata:
  name: ecr-service-images
spec:
  store:
    driver: oci
    keyTemplate: "build-{{ .SpecHex }}"
    oci:
      repository: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/services
      stampAnnotation: dev.kargops.artifacts.spec-hash
  generator:
    template:
      apiVersion: tekton.dev/v1
      kind: PipelineRun
      spec:
        pipelineRef:
          name: kaniko-build
        params:
          - name: git-url
            value: "{{ .Identity.repo }}"
          - name: git-revision
            value: "{{ .Identity.commit }}"
          - name: dockerfile
            value: "{{ .Identity.dockerfile }}"
          - name: platform
            value: "{{ .Identity.platform }}"
          # The generator contract: push exactly here, stamped with this hash.
          # With kaniko:
          #   --destination=$(params.image-ref)
          #   --label=dev.kargops.artifacts.spec-hash=$(params.stamp)
          - name: image-ref
            value: "123456789012.dkr.ecr.eu-west-1.amazonaws.com/services:{{ .Key }}"
          - name: stamp
            value: "{{ .SpecHash }}"
    succeededWhen: "status.conditions.exists(c, c.type == 'Succeeded' && c.status == 'True')"
    failedWhen: "status.conditions.exists(c, c.type == 'Succeeded' && c.status == 'False')"
  backoff:
    maxAttempts: 3
    initialDelay: 2m
    maxDelay: 30m
  verificationGracePeriod: 3m
---
apiVersion: artifacts.kargops.dev/v1alpha1
kind: Artifact
metadata:
  name: checkout-api-abc123f-amd64
  namespace: builds
spec:
  classRef:
    name: ecr-service-images
  identity:
    repo: https://git.example.com/services/checkout-api.git
    commit: abc123f4e5d6c7b8a9012345678901234567890a
    dockerfile: ./Dockerfile
    platform: linux/amd64
  interval: 10m
  deletionPolicy: Orphan
